name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  platform-tests:
    name: test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          MEETING_COPILOT_SKIP_BROWSER_TEST: "1"
      - run: npm run test:native
      - run: npm run package:audio
      - run: npm run test:package
      - run: npm audit --audit-level=high

  test:
    if: always()
    needs: platform-tests
    runs-on: ubuntu-latest
    steps:
      - name: Require every macOS test job to pass
        run: test '${{ needs.platform-tests.result }}' = 'success'
